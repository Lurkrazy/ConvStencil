# ConvStencil Benchmark Configuration

name: "convstencil_comprehensive_benchmark"
executable: "convstencil"
output_dir: "results"

# Stencil shapes to benchmark
shapes:
  - "star_1d1r"
  - "star_1d2r"
  - "box_2d1r"
  - "star_2d1r"
  - "box_2d3r"
  - "star_2d3r"
  - "box_3d1r"
  - "star_3d1r"

# Problem sizes to test
sizes:
  # 1D sizes
  - [1024]
  - [4096]
  - [16384]
  - [65536]
  
  # 2D sizes
  - [256, 256]
  - [512, 512]
  - [1024, 1024]
  - [2048, 2048]
  
  # 3D sizes
  - [64, 64, 64]
  - [128, 128, 128]
  - [256, 256, 256]

# Time iterations to test
iterations:
  - 10
  - 100
  - 1000

# Benchmark settings
warmup_runs: 3
measurement_runs: 10